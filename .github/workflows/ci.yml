name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm test

  licence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install reuse
      - run: reuse lint

  dco:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commits are signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            author="$(git show -s --format='%an <%ae>' "$sha")"
            # Bots hold no copyright and cannot sign off.
            case "$author" in
              *"[bot]"*|*"dependabot"*) continue ;;
            esac
            if git show -s --format='%B' "$sha" \
                 | grep -qiF "Signed-off-by: $author"; then
              continue
            fi
            echo "::error::Missing or mismatched Signed-off-by on $sha ($author)"
            fail=1
          done < <(git rev-list "$BASE..$HEAD")
          if [ "$fail" -ne 0 ]; then
            echo "Sign off with: git commit -s   (fix the last one: git commit --amend -s)"
            exit 1
          fi
          echo "All commits signed off."
